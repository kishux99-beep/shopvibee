name: 🔄 Live Amazon Price Sync

on:
  schedule:
    # Har 12 ghante mein automatically run hoga (Midnight aur Midday UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Is button se aap GitHub par manually bhi 1-click run kar sakte hain

permissions:
  contents: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Run Price Sync Engine
        run: node syncPrices.js

      - name: 💾 Commit & Push Updated Prices
        run: |
          git config --global user.name "ShopVibee Bot"
          git config --global user.email "bot@shopvibee.in"
          git add data/deals.ts data/flashDeals.ts data/topDeals.ts
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-sync: Updated live Amazon prices [skip ci]" && git push)